<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momiko | LP制作</title>
    <style>
      :root { --text:#111827; --muted:#6b7280; --line:#e5e7eb; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: "Noto Sans JP", system-ui, sans-serif; color:var(--text); background:#fff; }
      .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
      header { display:flex; justify-content:space-between; align-items:center; padding:24px 0; }
      .logo { font-size:40px; font-weight:700; letter-spacing:.02em; }
      nav { display:flex; gap:28px; font-weight:600; }
      .hero { display:grid; grid-template-columns: 1.1fr .9fr; gap:24px; align-items:center; padding:24px 0 64px; }
      h1 { font-size:56px; line-height:1.25; margin:0 0 24px; }
      p { margin:0 0 14px; line-height:1.8; }
      .btns{display:flex; gap:12px; margin-top:20px;}
      .btn{display:inline-block;padding:14px 24px;border-radius:12px;text-decoration:none;font-weight:700;border:1px solid #111;}
      .btn-primary{background:#111;color:#fff;}
      .btn-secondary{color:#111;background:#fff;}
      .photo { width:100%; aspect-ratio:3/4; border-radius:20px; background:linear-gradient(135deg,#f3f4f6,#e5e7eb); }
      section { padding:56px 0; border-top:1px solid var(--line); }
      h2 { font-size:34px; margin:0 0 24px; }
      .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
      .card { border:1px solid var(--line); border-radius:14px; padding:20px; }
      .price { font-size:36px; font-weight:700; margin:6px 0 8px; }
      footer { border-top:1px solid var(--line); padding:30px 0; color:var(--muted); }
      @media (max-width:900px){
        .hero { grid-template-columns:1fr; }
        h1 { font-size:40px; }
        .cards { grid-template-columns:1fr; }
        .logo { font-size:32px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">Momiko</div>
        <nav>
          <span>制作実績</span>
          <span>サービス</span>
          <span>プロフィール</span>
        </nav>
      </header>

      <main class="hero">
        <div>
          <h1>想いを、<br />売上に変えるLP制作</h1>
          <p>個人事業主・クリエイター向けに、LP・決済・導線設計まで一緒に整理します。</p>
          <p>YouTube 3,000人 / 公式クリエイター / LINEコミュニティ運営</p>
          <div class="btns">
            <a class="btn btn-primary" href="#">無料で相談する</a>
            <a class="btn btn-secondary" href="#">制作実績を見る</a>
          </div>
        </div>
        <div class="photo" aria-label="プロフィール画像のプレースホルダー"></div>
      </main>

      <section>
        <h2>PRICE</h2>
        <div class="cards">
          <article class="card"><h3>ライト</h3><div class="price">98,000円〜</div><p>短めLP / 素材あり向け</p></article>
          <article class="card"><h3>スタンダード</h3><div class="price">198,000円〜</div><p>構成・デザイン・実装まで対応</p></article>
          <article class="card"><h3>導線設計プラン</h3><div class="price">298,000円〜</div><p>LP + 決済導線 + コミュニティ導線</p></article>
        </div>
      </section>

      <footer>© 2026 Momiko. All Rights Reserved.</footer>
    </div>
  </body>
</html>
